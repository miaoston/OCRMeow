name: OCRMeow All-in-One Pipeline

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Fonts (for OCR Test)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-wqy-zenhei

      - name: Install Puppeteer Browsers
        run: npx puppeteer browsers install chrome

      - name: Run code checks (lint, format, type-check)
        run: npm run check

      - name: Build Production Package (Lean Only)
        run: npm run build

      - name: Run OCR Easter Egg Test
        run: node tests/run_ocr_test.js

      - name: Rebuild Clean Production Package
        run: npm run build

      - name: Package Extension ZIP
        run: |
          cd dist
          zip -r ../ocrmeow.zip .
          cd ..

      - name: Upload Extension ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ocrmeow
          path: ocrmeow.zip
          retention-days: 14

      - name: Prepare Pages Demo Models
        run: |
          mkdir -p dist/models
          curl -L --fail --retry 3 --retry-delay 2 \
            -o dist/models/det.tar \
            https://github.com/miaoston/OCRMeow/releases/download/models/PP-OCRv5_mobile_det_onnx.tar
          curl -L --fail --retry 3 --retry-delay 2 \
            -o dist/models/rec.tar \
            https://github.com/miaoston/OCRMeow/releases/download/models/PP-OCRv5_mobile_rec_onnx.tar
          test "$(wc -c < dist/models/det.tar)" -gt 1000000
          test "$(wc -c < dist/models/rec.tar)" -gt 1000000

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
